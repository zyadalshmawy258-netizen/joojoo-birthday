<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عيد ميلاد جوجو 🎀</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{background:linear-gradient(135deg,#fff7fb,#fff0f7,#f5efff);color:#54233f;overflow-x:hidden}
.wrap{max-width:900px;margin:auto;padding:22px 14px 50px;position:relative}
.card{background:rgba(255,255,255,.9);border:3px solid #ffd0e3;border-radius:28px;box-shadow:0 15px 45px rgba(190,100,145,.18);padding:28px 18px;text-align:center;position:relative;z-index:2}
.badge{display:inline-block;background:#ffe1ee;border-radius:999px;padding:9px 17px;font-weight:700}
h1{font-size:clamp(38px,8vw,72px);margin:12px 0 2px;color:#e65d98}
.sub{font-size:clamp(18px,4vw,28px);font-weight:700}
.age{width:92px;height:92px;border-radius:50%;margin:18px auto;background:#ffd66e;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#7a4a00;box-shadow:0 7px 0 #eebd4d}
.msg{font-size:18px;line-height:2;max-width:700px;margin:10px auto}
.btn{border:0;border-radius:999px;padding:13px 22px;background:#ed6da7;color:white;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 7px 0 #c84f86;margin:6px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #c84f86}
.photo-card{margin-top:22px;background:white;border:10px solid white;border-radius:22px;box-shadow:0 10px 35px rgba(100,50,80,.18);overflow:hidden}
.photo{display:block;width:100%;height:auto;max-height:900px;object-fit:contain}
.footer{text-align:center;margin-top:24px;font-weight:700;font-size:17px}
.balloon{position:fixed;bottom:-100px;width:45px;height:58px;border-radius:50%;opacity:.8;animation:up 13s linear infinite;z-index:1}
.balloon:after{content:"";position:absolute;left:50%;top:56px;height:90px;border-left:1px solid #b89aaa}
.b1{left:7%;background:#ff9fc5;animation-delay:-2s}.b2{left:22%;background:#ffd36e;animation-delay:-7s}.b3{left:78%;background:#a9e6ff;animation-delay:-4s}.b4{left:91%;background:#cbb2ff;animation-delay:-10s}
@keyframes up{0%{transform:translateY(0)}100%{transform:translateY(-125vh) rotate(10deg)}}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;font-size:22px;color:#ffd45a}
.s{position:absolute;animation:tw 2s infinite alternate}
.s1{left:10%;top:12%}.s2{left:86%;top:18%;animation-delay:.5s}.s3{left:17%;top:70%;animation-delay:1s}.s4{left:82%;top:72%;animation-delay:.3s}
@keyframes tw{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.25)}}
@media(max-width:600px){.wrap{padding:12px 9px 35px}.card{padding:22px 12px}.msg{font-size:16px}}
</style>
</head>
